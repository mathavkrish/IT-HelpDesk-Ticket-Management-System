<!doctype html>
{% extends "base.html" %}
{% block title %}Create Ticket | IT Help Desk{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Create Support Ticket</h1>
    <p class="text-secondary">Describe the IT issue you need help with.</p>
</div>

<div class="main-card p-4">
    <form method="POST" action="{{ url_for('new_ticket') }}">
        <div class="mb-3">
            <label for="employee_name" class="form-label">Employee Name</label>
            <input id="employee_name" name="employee_name"
                   class="form-control" maxlength="100" required
                   value="{{ form.get('employee_name', '') }}">
        </div>

        <div class="mb-3">
            <label for="title" class="form-label">Issue Title</label>
            <input id="title" name="title" class="form-control"
                   maxlength="150" required
                   placeholder="Example: Laptop is not starting"
                   value="{{ form.get('title', '') }}">
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Issue Description</label>
            <textarea id="description" name="description"
                      class="form-control" rows="5" maxlength="5000"
                      required>{{ form.get('description', '') }}</textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category" class="form-select" required>
                    <option value="">Select category</option>
                    {% for category in categories %}
                    <option value="{{ category }}"
                        {% if form.get('category') == category %}selected{% endif %}>
                        {{ category }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label for="priority" class="form-label">Priority</label>
                <select id="priority" name="priority" class="form-select" required>
                    <option value="">Select priority</option>
                    {% for priority in priorities %}
                    <option value="{{ priority }}"
                        {% if form.get('priority') == priority %}selected{% endif %}>
                        {{ priority }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Submit Ticket</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
